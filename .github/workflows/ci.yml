name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # e2e panggung 3D digambar CPU (runner tanpa GPU); sejak Clawd (M3–M4) tesnya lebih banyak dan tiap frame 3D
    # menggambar Clawd juga, jadi e2e ±17–20 menit. Batas 20 menit memotong run PR yang berjalan bersamaan run push.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --trace off
