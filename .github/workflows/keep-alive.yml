name: Keep-alive Supabase

# Project Supabase paket gratis di-pause setelah ±7 hari tanpa aktivitas.
# Ping fungsi `health` (menyentuh database) tiap 2 hari. Jadwal hanya berjalan dari branch default (main).
on:
  schedule:
    - cron: "17 3 */2 * *" # 10:17 WIB
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 https://qanjzavzbisvpmeihqee.supabase.co/functions/v1/health; then echo; exit 0; fi
            echo "percobaan $i gagal, ulang 20 dtk lagi"; sleep 20
          done
          exit 1
